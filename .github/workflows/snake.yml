name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
outputs: |
  dist/github-snake.svg?color_snake=%23ffffff&color_dots=%23000000,%23000000,%23000000,%23000000,%23000000
  dist/github-snake-dark.svg?palette=github-dark
  dist/github-snake-neon.svg?color_snake=%23ffffff&color_dots=%23000000,%23000000,%23000000,%23000000,%23000000
  dist/github-snake.gif?color_snake=%23ffffff&color_dots=%23000000,%23000000,%23000000,%23000000,%23000000
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
